<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощник для королевы</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf7f4; --card: #fff; --ink: #22202a; --dim: #6f6b7a; --line: #ece5e0;
    --accent: #8a4fbe; --accent-soft: #f3ecfa; --price: #1f7a4d; --shadow: 0 1px 2px rgba(40,20,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151c; --card: #201d27; --ink: #efecf3; --dim: #a49fb0; --line: #2e2a37;
      --accent: #c39bec; --accent-soft: #2a2136; --price: #6fd39f; --shadow: none;
    }
  }
  body { background: var(--bg); color: var(--ink);
         font: 15.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }
  header { text-align: center; margin-bottom: 26px; }
  .crown { font-size: 26px; display: block; margin-bottom: 4px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { color: var(--dim); margin: 0; font-size: 15px; }
  #hint { color: var(--dim); font-size: 13px; margin-top: 6px; }

  .layout { display: grid; grid-template-columns: 270px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .side { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 6px 16px 14px; box-shadow: var(--shadow); position: sticky; top: 16px; }
  @media (max-width: 820px) { .side { position: static; } }
  .group { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }
  .gt { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
        margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; }
  .drop { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px;
          text-transform: none; letter-spacing: 0; cursor: pointer; padding: 0; }
  .opts { display: flex; flex-direction: column; gap: 1px; }
  .opts.many > .opt:nth-child(n+9) { display: none; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 5px 7px; border-radius: 8px; cursor: pointer; }
  .opt:hover { background: var(--accent-soft); }
  .opt.on { background: var(--accent-soft); }
  .opt input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .opt .lbl { flex: 1; font-size: 14.5px; }
  .opt .cnt { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .more { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px;
          cursor: pointer; padding: 6px 7px 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin-bottom: 12px; flex-wrap: wrap; }
  #count { font-weight: 500; }
  .tools { display: flex; gap: 8px; align-items: center; }
  select, .btn { font: inherit; font-size: 14px; background: var(--card); color: var(--ink);
                 border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .btn:hover, select:hover { border-color: var(--accent); }

  .item { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 15px 17px; margin-bottom: 9px; box-shadow: var(--shadow); }
  .title { font-weight: 500; margin-bottom: 7px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12.5px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .tag.soft { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .right { text-align: right; flex-shrink: 0; }
  .price { font-size: 20px; font-weight: 600; color: var(--price); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .price .per { font-size: 13px; font-weight: 400; color: var(--dim); }
  .second { font-size: 12.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; }
  .open { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); text-decoration: none;
          border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .open:hover { border-color: var(--accent); }
  .none { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; text-align: center; }
  .none p { color: var(--dim); font-size: 14.5px; margin: 8px 0 0; }
  #more-wrap { text-align: center; margin-top: 14px; }
  footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 13px; }
  footer a { color: var(--accent); }
  @media (max-width: 560px) { .item { flex-direction: column; gap: 10px; } .right { text-align: left; } }
</style>

<div class="wrap">
  <header>
    <span class="crown">👑</span>
    <h1>Помощник для королевы</h1>
    <p>Выберите слева, что нужно — справа появятся товары и цены</p>
    <div id="hint">Загружаю каталог…</div>
  </header>

  <div class="layout">
    <aside class="side" id="facets"></aside>
    <main>
      <div class="topbar">
        <div id="count"></div>
        <div class="tools">
          <select id="sort" aria-label="Сортировка">
            <option value="price">сначала дешёвые</option>
            <option value="price-desc">сначала дорогие</option>
          </select>
          <button class="btn" id="reset" hidden>Сбросить всё</button>
        </div>
      </div>
      <div id="list"></div>
      <div id="more-wrap" hidden><button class="btn" id="more-btn">Показать ещё</button></div>
    </main>
  </div>

  <footer>
    Цены ТК Болт.Ру, обновляются раз в сутки. Всё считается прямо в браузере.<br>
    <a href="pro.html">Режим для списков и файлов ТЗ</a>
  </footer>
</div>

<script type="module" src="js/facets.js"></script>
