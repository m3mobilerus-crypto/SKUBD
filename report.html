const TOTALS = {"positions":25,"withOffer":19,"cost":39425.3,"suppliers":{"МТК «Пуролат» (СПб)":{"sum":5422.75,"n":8,"min":null},"ТК Болт.Ру (Москва)":{"sum":34002.55,"n":11,"min":4000}}};
const rub = n => n == null ? '—' : n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
const stClass = s => s === 'не найдено' ? 'no' : s === 'найден аналог' ? 'an' : 'ok';

const cards = [
  { k: 'Позиций', v: TOTALS.positions },
  { k: 'С предложением', v: TOTALS.withOffer, n: Math.round(TOTALS.withOffer / TOTALS.positions * 100) + '%' },
  { k: 'Стоимость закупки', v: rub(TOTALS.cost) },
  ...Object.entries(TOTALS.suppliers).map(([t, s]) => ({
    k: t, v: rub(s.sum), n: s.n + ' поз.' + (s.min != null && s.sum < s.min ? ' · ниже минимального заказа ' + s.min + ' ₽' : ''),
  })),
];
document.getElementById('cards').innerHTML = cards.map(c =>
  '<div class="card"><div class="k">' + c.k + '</div><div class="v">' + c.v + '</div>' +
  (c.n ? '<div class="n">' + c.n + '</div>' : '') + '</div>').join('');

function offersTable(p) {
  if (!p.offers.length) return '<div class="empty">У этих поставщиков нет такой позиции — ищите в других местах</div>';
  return '<div class="scroll"><table class="tbl"><thead><tr>' +
    ['Поставщик','Предложение','Как продаётся','Цена','Упаковка','К покупке','Стоимость','Цена/шт','Наличие',''].map(h => '<th>' + h + '</th>').join('') +
    '</tr></thead><tbody>' + p.offers.map((o, i) =>
      '<tr' + (i === 0 ? ' class="best"' : '') + '>' +
      '<td>' + o.supplier + '</td>' +
      '<td>' + o.name + (o.note ? '<div class="note">' + o.note + '</div>' : '') + '</td>' +
      '<td>' + (o.sellUnit || '—') + '</td>' +
      '<td class="num-cell">' + (o.priceSell != null ? o.priceSell + ' ₽/' + (o.sellUnit || 'шт') : '—') + '</td>' +
      '<td class="num-cell">' + (o.pack || '—') + '</td>' +
      '<td class="num-cell">' + (o.buy || '—') + '</td>' +
      '<td class="num-cell">' + rub(o.cost) + '</td>' +
      '<td class="num-cell">' + (o.pricePiece != null ? o.pricePiece + (o.pieceBasis && o.pieceBasis.startsWith('расчёт') ? '*' : '') : '—') + '</td>' +
      '<td class="num-cell">' + (o.stock != null ? o.stock : (o.inStock === false ? 'нет' : '—')) + '</td>' +
      '<td><a href="' + o.url + '" target="_blank" rel="noopener">открыть</a></td></tr>').join('') +
    '</tbody></table></div>';
}

function render(filter) {
  const rows = DATA.filter(p => filter === 'all' || (filter === 'found' ? p.offers.length : !p.offers.length));
  document.getElementById('count').textContent = 'показано ' + rows.length + ' из ' + DATA.length;
  document.getElementById('list').innerHTML = rows.map(p => {
    const best = p.offers[0];
    const parts = [p.parsed.type, p.parsed.d != null ? 'M' + p.parsed.d : null,
      p.parsed.L != null ? 'L' + p.parsed.L : null, p.parsed.grade, p.parsed.standard, p.parsed.coating]
      .filter(Boolean).join(' · ');
    const need = p.qtyPieces != null ? p.qtyPieces + ' шт' : (p.qty != null ? p.qty + ' ' + (p.unit || '') : '');
    return '<div class="pos"><div class="head" role="button" tabindex="0">' +
      '<div class="num">' + p.row + '</div>' +
      '<div><div class="nm">' + p.name + '</div><div class="meta">' + parts +
        (need ? ' — нужно ' + need : '') + (p.qtyNote ? ' · ' + p.qtyNote : '') +
        (p.parsed.warnings.length ? ' · ⚠ ' + p.parsed.warnings.join('; ') : '') + '</div></div>' +
      '<div class="st ' + stClass(p.status) + '">' + p.status + '</div>' +
      '<div class="cost">' + (best ? rub(best.cost) : '') + '</div></div>' +
      '<div class="body" hidden>' + offersTable(p) + '</div></div>';
  }).join('');

  document.querySelectorAll('.head').forEach(h => {
    const toggle = () => { const b = h.nextElementSibling; b.hidden = !b.hidden; };
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
}

document.querySelectorAll('button.f').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('button.f').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render(b.dataset.f);
}));
render('all');
</script>
